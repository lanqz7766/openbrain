[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbrain"
version = "1.0.0"
description = "Reference-free QC, selection, and evaluation toolkit for the OpenBrain v1.0 brain MRI release."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
keywords = ["brain MRI", "segmentation", "quality control", "benchmark"]
classifiers = [
 "License :: OSI Approved :: MIT License",
 "Programming Language :: Python :: 3.10",
 "Programming Language :: Python :: 3.11",
 "Programming Language :: Python :: 3.12",
 "Operating System :: OS Independent",
 "Intended Audience :: Science/Research",
 "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
 "numpy>=1.24",
 "pandas>=2.0",
 "nibabel>=5.0",
 "SimpleITK>=2.3",
 "scipy>=1.10",
 "scikit-learn>=1.3",
 "matplotlib>=3.7",
 "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
 "pytest>=7.4",
 "ruff>=0.4",
 "jupyterlab>=4.0",
]
gpu = [
 # Lazy GPU dependencies are imported only at inference time.
 # Users provide their own torch / monai / nnunetv2 install matching
 # the local CUDA toolchain.
]

[project.urls]
Homepage = "https://huggingface.co/datasets/openbrain-anonymous/openbrain_v1_0"
Repository = "https://github.com/openbrain-anonymous/openbrain"

[project.scripts]
openbrain-core7 = "core7.__main__:main"

[tool.setuptools.packages.find]
include = ["core7*", "inference*", "selection*", "eval*", "figures*"]
exclude = ["tests*", "notebooks*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
